name: Phase 6 HostReady read convergence

on:
  push:
    branches:
      - homepage-visual-conversion-rebuild
    paths:
      - .github/workflows/phase6-hostready-read.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homepage-visual-conversion-rebuild
          fetch-depth: 0
      - name: Apply narrow HostReady patch
        run: python scripts/phase6-hostready-patch.py
      - name: Verify TypeScript
        run: npm ci && npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "Place & Plenty Reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/host-data.ts scripts/phase6-hostready-patch.py .github/workflows/phase6-hostready-read.yml
          git commit -m "feat(phase6): read canonical HostReady on Host Web"
          git push origin HEAD:homepage-visual-conversion-rebuild
