name: Materialize Paper Suite assets

on:
  push:
    branches:
      - ui-paper-suite-assets
    paths:
      - "assets/paper-suite-base64/**"
      - "scripts/materialize-paper-suite-assets.mjs"
      - ".github/workflows/materialize-paper-suite-assets.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-paper-suite-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decode and validate Paper Suite assets
        run: node scripts/materialize-paper-suite-assets.mjs
      - name: Commit materialized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/harding-paper-suite.webp public/images/paper-suite-card-sprite.webp
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Materialize high-resolution Paper Suite imagery"
          git push origin HEAD:ui-paper-suite-assets
