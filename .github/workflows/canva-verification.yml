name: Canva Feature Verification
on:
  push:
    branches: [feature/canva-hosting-integration]
  pull_request:
    paths:
      - 'canva-app/**'
      - 'lib/canva-*.ts'
      - 'app/api/canva/**'
      - 'app/(host)/host/canva/**'
      - 'docs/integrations/sql/**'
      - 'tests/canva-*.test.ts'
      - '.github/workflows/canva-verification.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            canva-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: canva-app
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck
        working-directory: canva-app
      - run: npm test
        working-directory: canva-app
      - run: npm run build
        working-directory: canva-app
      - uses: actions/upload-artifact@v4
        with:
          name: canva-localhost-sdk-bundle
          path: canva-app/dist/app.js
# Build/test only. No deployment, database mutation, portal login, or submission.
