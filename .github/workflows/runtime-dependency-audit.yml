name: Runtime Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-dependency-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trace critical dependency chains
        shell: bash
        run: |
          for pkg in '@tinacms/graphql' dompurify jsonpath-plus next; do
            echo "=== npm explain $pkg ==="
            npm explain "$pkg" || true
          done
      - name: Build production site and inspect deployed traces
        shell: bash
        run: |
          npm run build
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const roots=['.next/server','.next/static'];
          const needles=['@tinacms/graphql','dompurify','jsonpath-plus','node_modules/next'];
          const hits=Object.fromEntries(needles.map(n=>[n,[]]));
          function walk(p){
            if(!fs.existsSync(p)) return;
            for(const e of fs.readdirSync(p,{withFileTypes:true})){
              const f=path.join(p,e.name);
              if(e.isDirectory()) walk(f);
              else if(e.isFile() && fs.statSync(f).size < 5_000_000){
                let s=''; try{s=fs.readFileSync(f,'utf8')}catch{}
                for(const n of needles) if(s.includes(n)) hits[n].push(f);
              }
            }
          }
          roots.forEach(walk);
          console.log('TRACE_HITS='+JSON.stringify(hits,null,2));
          NODE
