name: Runtime Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-dependency-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production/runtime dependencies only
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('runtime-audit.json','utf8'));
          const vulns = a.vulnerabilities || {};
          const critical = Object.entries(vulns)
            .filter(([,v]) => v.severity === 'critical')
            .map(([name,v]) => ({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              via:v.via,
              effects:v.effects,
              range:v.range,
              nodes:v.nodes,
              fixAvailable:v.fixAvailable
            }));
          console.log(JSON.stringify({
            metadata:a.metadata,
            critical,
            high:Object.values(vulns).filter(v=>v.severity==='high').length,
            moderate:Object.values(vulns).filter(v=>v.severity==='moderate').length
          }, null, 2));
          NODE
