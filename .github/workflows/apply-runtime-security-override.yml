name: Apply Minimal Runtime Security Override

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-runtime-security-override.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin patched DOMPurify within TinaCMS/Mermaid compatibility line
        run: npm pkg set overrides.dompurify=2.4.2
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify deterministic install and resolved version
        run: |
          npm ci
          npm explain dompurify
          npm run typecheck
          npm test
      - name: Commit dependency-only security patch
        shell: bash
        run: |
          git config user.name "place-and-plenty-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "Patch runtime DOMPurify vulnerability"
            git push origin HEAD:main
          fi
